# English Path lesson content. Edit, add or remove units and sentences.
# Keep at least 3 sentences per unit (4 works best). Quote colors like "#34c759".
# Serve this file next to index.html (any web server). Opened directly from
# a file, the app falls back to the built-in lessons.
units:
  - name: "Advanced vocabulary"
    telugu: "అధునాతన పదజాలం"
    color: "#34c759"
    dark: "#248a3d"
    sentences:
      - te: "అతను చాలా పట్టుదల గల వ్యక్తి."
        en: "He is a very persistent person."
      - te: "ఈ సమస్యకు పరిష్కారం కనుగొనడం కష్టం."
        en: "It is difficult to find a solution to this problem."
      - te: "ఆమె తన లక్ష్యాన్ని సాధించడానికి కృషి చేసింది."
        en: "She worked hard to achieve her goal."
      - te: "మనం ఎల్లప్పుడూ నిజం మాట్లాడాలి."
        en: "We should always speak the truth."
  - name: "Opinions and reasoning"
    telugu: "అభిప్రాయాలు"
    color: "#0a84ff"
    dark: "#0060df"
    sentences:
      - te: "నా అభిప్రాయం ప్రకారం, ఇది ఉత్తమ నిర్ణయం."
        en: "In my opinion, this is the best decision."
      - te: "వాతావరణ మార్పు ప్రపంచానికి పెద్ద ముప్పు."
        en: "Climate change is a major threat to the world."
      - te: "పరిస్థితులు ఎలా ఉన్నా, నేను ప్రయత్నిస్తూనే ఉంటాను."
        en: "No matter the circumstances, I will keep trying."
      - te: "ఆయన సలహా నాకు చాలా ఉపయోగపడింది."
        en: "His advice was extremely useful to me."
  - name: "Work and career"
    telugu: "ఉద్యోగం"
    color: "#bf5af2"
    dark: "#8944ab"
    sentences:
      - te: "నేను రేపటి సమావేశానికి సిద్ధంగా ఉన్నాను."
        en: "I am prepared for tomorrow's meeting."
      - te: "దయచేసి ఈ నివేదికను సమీక్షించండి."
        en: "Please review this report."
      - te: "ఆమెకు ఆ పదవికి అవసరమైన అనుభవం ఉంది."
        en: "She has the experience required for that position."
      - te: "గడువులోగా పని పూర్తి చేయడం ముఖ్యం."
        en: "It is important to complete the work within the deadline."
  - name: "Grammar in use"
    telugu: "వ్యాకరణం"
    color: "#ff9f0a"
    dark: "#c77700"
    sentences:
      - te: "నువ్వు కష్టపడి చదివితే, పరీక్షలో ఉత్తీర్ణత సాధిస్తావు."
        en: "If you study hard, you will pass the exam."
      - te: "వర్షం పడకపోయి ఉంటే, మేము బయటికి వెళ్లేవాళ్లం."
        en: "If it had not rained, we would have gone out."
      - te: "ఆమె నాకంటే వేగంగా పరుగెత్తుతుంది."
        en: "She runs faster than I do."
      - te: "నేను ఇక్కడ మూడు సంవత్సరాలుగా నివసిస్తున్నాను."
        en: "I have been living here for three years."
  - name: "Travel and culture"
    telugu: "ప్రయాణం"
    color: "#ff453a"
    dark: "#d70015"
    sentences:
      - te: "ఈ నగరం దాని చారిత్రక కట్టడాలకు ప్రసిద్ధి."
        en: "This city is famous for its historic monuments."
      - te: "మీరు ఇంతకుముందు ఇక్కడికి వచ్చారా?"
        en: "Have you been here before?"
      - te: "స్థానిక సంప్రదాయాలను గౌరవించాలి."
        en: "One must respect local traditions."
      - te: "విమానం రెండు గంటలు ఆలస్యమైంది."
        en: "The flight was delayed by two hours."
  - name: "Everyday idioms"
    telugu: "జాతీయాలు"
    color: "#30d5c8"
    dark: "#00a39a"
    sentences:
      - te: "కష్టపడితే ఫలితం దక్కుతుంది."
        en: "Hard work pays off."
      - te: "అతను అవకాశాన్ని చేజార్చుకున్నాడు."
        en: "He let the opportunity slip away."
      - te: "ఆమె ఎప్పుడూ ఇతరులకు అండగా నిలబడుతుంది."
        en: "She always stands by others."
      - te: "పని మొదలుపెట్టడానికి ఇదే సరైన సమయం."
        en: "Now is the right time to get started."
